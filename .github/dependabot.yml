version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Types must match the runtime (Node 24 LTS, see .nvmrc); bump together with it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', 'eslint-config-next']
      antd:
        patterns: ['antd', '@ant-design/*']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', '@playwright/test', 'jsdom']
      lint-format:
        patterns: ['eslint*', 'prettier', '@commitlint/*', 'lint-staged', 'husky']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Stay on Node 24 LTS (see .nvmrc); major upgrades are done deliberately.
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
